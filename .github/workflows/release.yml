name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt update
          sudo apt install gcc-aarch64-linux-gnu ninja-build asciidoctor
      - uses: actions/checkout@v7
      - name: Build for x86_64-linux-gnu
        run: |
          cmake -G Ninja -B build
          ninja -C build
          strip build/espresso
          mv build/espresso x86_64-linux-gnu-espresso
          rm -rf build
      - name: Build for aarch64-linux-gnu
        run: |
          cmake -G Ninja -B build -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          ninja -C build
          aarch64-linux-gnu-strip build/espresso
          mv build/espresso aarch64-linux-gnu-espresso
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: "*-espresso"
          if-no-files-found: error
  build-macos:
    runs-on: macos-26
    steps:
      - run: brew install ninja asciidoctor
      - uses: actions/checkout@v7
      - name: Build for x86_64-apple-macos
        run: |
          cmake -G Ninja -B build -DCMAKE_C_COMPILER_TARGET=x86_64-apple-macos
          ninja -C build
          strip build/espresso
          mv build/espresso x86_64-apple-macos-espresso
          rm -rf build
      - name: Build for arm64-apple-macos
        run: |
          cmake -G Ninja -B build
          ninja -C build
          strip build/espresso
          mv build/espresso arm64-apple-macos-espresso
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: "*-espresso"
          if-no-files-found: error
  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "*-espresso"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          draft: true
